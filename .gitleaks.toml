title = "Investec Swag Portal secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "The committed environment template contains documented non-secret placeholders only."
paths = [
  '''(^|/)\.env\.example$'''
]

[[allowlists]]
description = "Synthetic CI canary markers are test fixtures, not credentials."
regexes = [
  '''CI_CANARY_[A-F0-9]{32}'''
]
