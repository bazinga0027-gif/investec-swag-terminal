name: CI Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run API tests
        run: bun test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type checks
        run: bun typecheck

  admin-build:
    name: Admin build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build admin dashboard
        run: bun run build:admin

  go-tests:
    name: Go tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ssh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/ssh/go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Build SSH server
        run: go build -o bin/ssh-server ./cmd/ssh/main.go

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify secret scanner detects a known test canary
        shell: bash
        run: |
          set +e
          canary_dir="${RUNNER_TEMP}/gitleaks-canary"
          mkdir -p "$canary_dir"
          printf '%s\n' 'token = "ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789"' > "$canary_dir/canary.txt"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$canary_dir:/canary:ro" \
            ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa432630ce4e4b08a7f119122045e176ca9d44ff00b08b \
            dir --config /repo/.gitleaks.toml --exit-code 1 --redact --no-banner /canary
          status=$?

          rm -rf "$canary_dir"

          if [ "$status" -eq 0 ]; then
            echo 'Secret scanner canary was not detected; refusing to trust the gate.'
            exit 1
          fi

          if [ "$status" -ne 1 ]; then
            echo "Secret scanner canary test failed unexpectedly with exit code $status."
            exit "$status"
          fi

          echo 'Secret scanner canary was detected as expected.'

      - name: Scan repository history for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa432630ce4e4b08a7f119122045e176ca9d44ff00b08b \
            git --config /repo/.gitleaks.toml --exit-code 1 --redact --no-banner /repo
